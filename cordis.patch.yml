# dsh-memories bundle patch: one Host plugin row.
#
# Every config key is optional; safe defaults: 8192-char injection budget
# per scope, 16384-char short-term file retention, ['.git'] project-root
# markers, DSH home from $DSH_HOME (or ~/.dsh). Override this row by id in
# a later patch layer (profile cordis.patch.yml); a matching override
# replaces `config` wholesale, so restate every field you need.
- insert:
    - id: memories
      name: '@local/dsh-memories'
      config: {}
